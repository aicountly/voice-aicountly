# ---------------------------------------------------------------------------
# Verify the live Voice  (production https://voice.aicountly.com,
#                         sandbox    https://voice.gh.aicountly.com)
#
# MANUAL ONLY, and it deploys nothing. It runs the deploy workflows' own
# post-deploy checks (scripts/ci/post-deploy-checks.sh) against whatever is
# live now: the health JSON must come from the Voice API, and the web root
# must be the Voice page. With no build to compare, the page's <title> stands
# in for the build's entry script.
#
# The host's anti-bot page answers some requests from GitHub's runners with
# HTTP 200. When the runner is shown it, the request is repeated from the
# server over SSH, which is why this job sets up the deploy workflow's SSH
# key for the chosen environment. It only ever runs curl there. The paths
# that must not be served (api/.env, error_log, .git/HEAD ...) are asked from
# the server only, never from the runner: the host's WAF graylists a runner
# that asks for them, and drops its SSH with it.
# ---------------------------------------------------------------------------
name: Verify live app

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment to check
        type: choice
        options:
          - production
          - sandbox
        default: production

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The same SSH setup as the deploy workflow for this environment.
      - name: Configure SSH
        env:
          TARGET: ${{ inputs.environment }}
          SSH_PRIVATE_KEY: ${{ inputs.environment == 'production' && secrets.PROD_SSH_PRIVATE_KEY || secrets.SANDBOX_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ inputs.environment == 'production' && secrets.PROD_SSH_HOST || secrets.SANDBOX_SSH_HOST }}
          SSH_USER: ${{ inputs.environment == 'production' && secrets.PROD_SSH_USER || secrets.SANDBOX_SSH_USER }}
          # The port is optional (default 22). The default sits inside each
          # branch, so an unset production port cannot fall through to the
          # sandbox one.
          SSH_PORT: ${{ inputs.environment == 'production' && (secrets.PROD_SSH_PORT || '22') || (secrets.SANDBOX_SSH_PORT || '22') }}
        run: |
          if [ "$TARGET" = production ]; then p=PROD; else p=SANDBOX; fi
          missing=""
          [ -n "$SSH_HOST" ]        || missing="$missing ${p}_SSH_HOST"
          [ -n "$SSH_USER" ]        || missing="$missing ${p}_SSH_USER"
          [ -n "$SSH_PRIVATE_KEY" ] || missing="$missing ${p}_SSH_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty required secret(s):$missing"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          sed -i 's/\r$//' ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::${p}_SSH_PRIVATE_KEY is not a usable OpenSSH private key."
            exit 1
          fi

          # Pin the host key so the check fails closed rather than trusting
          # whatever answers on that address.
          if ! ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err; then
            echo "::error::ssh-keyscan could not reach the host on the configured port."
            sed 's/^/    /' /tmp/keyscan.err
            exit 1
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::The host returned no SSH host key. Check ${p}_SSH_HOST and ${p}_SSH_PORT."
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

          # Older cPanel hosts offer only RSA with SHA-1, hence the +ssh-rsa.
          cat > ~/.ssh/config <<CFG
          Host deploy-target
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            PubkeyAcceptedAlgorithms +ssh-rsa
            HostKeyAlgorithms +ssh-rsa
            BatchMode yes
          CFG
          chmod 600 ~/.ssh/config

      - name: Verify the live app
        env:
          TARGET: ${{ inputs.environment }}
          VERIFY_SSH: ssh deploy-target
          # Ask the server as well, even when the runner gets through: proves the fallback
          # a deploy relies on when the runner is shown the anti-bot page. (The
          # must-not-be-served paths are asked from the server only, never the runner.)
          VERIFY_FORCE_SERVER: '1'
          # Nothing was deployed here, so there is no build or commit to compare.
          EXPECTED_ENTRY: ''
          EXPECTED_REVISION: ''
        run: bash scripts/ci/post-deploy-checks.sh "$TARGET"

      - name: Clean up SSH credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
